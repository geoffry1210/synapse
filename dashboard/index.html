<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synapse terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E16; --panel:#10141F; --panel2:#151A28; --line:#232838; --line2:#2E3450;
  --text:#E6E9F2; --dim:#8790A8; --faint:#565E75;
  --accent:#6E5BFF; --accent-dim:#6E5BFF26; --pulse:#35E3E3;
  --up:#1FD37B; --up-dim:#1FD37B1F; --down:#FB4B53; --down-dim:#FB4B531F; --warn:#F5B94A; --warn-dim:#F5B94A22;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--pulse);outline-offset:1px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)} .faint{color:var(--faint)} .warn{color:var(--warn)} .pulse{color:var(--pulse)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* shell */
#app{display:grid;grid-template-columns:64px 1fr;grid-template-rows:52px 1fr;height:100vh;min-width:1100px}
#top{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 14px 0 0;background:var(--panel);border-bottom:1px solid var(--line)}
#logo{width:64px;height:52px;display:grid;place-items:center;border-right:1px solid var(--line)}
#logo svg{width:26px;height:26px}
.pairsel{display:flex;align-items:center;gap:6px}
.pairsel select{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:600 14px var(--mono);cursor:pointer}
.tk{display:flex;flex-direction:column;gap:1px}
.tk .l{font-size:11px;color:var(--faint)} .tk .v{font:500 12px var(--mono)}
.tk.big .v{font-size:20px;font-weight:600;line-height:1.1}
#top .sp{flex:1}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--up);box-shadow:0 0 0 0 var(--up);animation:beat 2.4s infinite}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--down)} .dot.live{background:var(--pulse);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 #35E3E366}70%{box-shadow:0 0 0 6px #35E3E300}100%{box-shadow:0 0 0 0 #35E3E300}}
#rail{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:6px 0}
#rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--dim);font-size:10.5px;text-decoration:none;border-left:2px solid transparent;cursor:pointer}
#rail a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#rail a:hover{color:var(--text);background:var(--panel2)}
#rail a.on{color:var(--pulse);border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-dim),transparent)}
#rail .gap{flex:1}
#view{overflow:auto;padding:8px;min-width:0}
#banner{display:none;margin:0 0 8px;padding:6px 10px;border:1px solid var(--line2);border-left:3px solid var(--warn);background:var(--warn-dim);border-radius:4px;font-size:12px}
#banner.on{display:flex;gap:10px;align-items:center}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-width:0;min-height:0}
.ph{display:flex;align-items:center;gap:10px;padding:0 10px;height:34px;border-bottom:1px solid var(--line);flex:none}
.ph h3{font-size:12.5px;font-weight:600}
.ph .tag{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.ph .tag.live{color:var(--pulse);border-color:#35E3E340} .ph .tag.hist{color:var(--dim)} .ph .tag.calc{color:var(--accent);border-color:#6E5BFF55} .ph .tag.sig{color:var(--warn);border-color:#F5B94A55}
.ph .sp{flex:1}
.pb{padding:10px;min-height:0;overflow:auto}
.tabs{display:flex;gap:2px;height:100%}
.tabs button{padding:0 12px;color:var(--dim);font-weight:500;border-bottom:2px solid transparent;height:100%}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button .n{margin-left:5px;font:500 10.5px var(--mono);background:var(--panel2);border-radius:8px;padding:1px 6px}

/* dashboard grid */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:8px;min-height:calc(100vh - 68px)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
#chartPanel{height:56vh;min-height:430px}
#chartWrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.tools button{padding:3px 7px;border-radius:3px;color:var(--dim);font:500 12px var(--mono)}
.tools button:hover{color:var(--text);background:var(--panel2)} .tools button.on{color:var(--pulse);background:var(--accent-dim)}
.tools .sep{width:1px;height:16px;background:var(--line);margin:0 6px}
.legend{position:absolute;left:10px;top:8px;font:11.5px var(--mono);color:var(--dim);pointer-events:none;display:flex;gap:12px;flex-wrap:wrap;max-width:75%}
.legend b{font-weight:500;color:var(--text)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--panel);text-align:right;font-weight:500;color:var(--faint);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default;z-index:1}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--text)}
td{padding:6px 8px;text-align:right;border-bottom:1px solid #1a1f2e;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.sans{font-family:var(--sans)}
tbody tr{cursor:default} tbody tr:hover{background:var(--panel2)} tr.sel{background:var(--accent-dim)}
.empty{padding:26px 12px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-weight:500;margin-bottom:3px}
.pill{display:inline-block;padding:1px 7px;border-radius:3px;font:500 11px var(--sans);border:1px solid transparent}
.pill.long,.pill.buy,.pill.success,.pill.filled{color:var(--up);background:var(--up-dim)}
.pill.short,.pill.sell,.pill.error,.pill.failed{color:var(--down);background:var(--down-dim)}
.pill.warn,.pill.partial{color:var(--warn);background:var(--warn-dim)}
.pill.info,.pill.pending{color:var(--pulse);background:#35E3E31A}
.pill.cancelled,.pill.neutral{color:var(--dim);background:var(--panel2);border-color:var(--line)}
.rowact{display:inline-flex;gap:2px}
.ibtn{padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--dim);font-size:11px;background:var(--panel2)}
.ibtn:hover{color:var(--text);border-color:var(--line2)} .ibtn.danger:hover{color:var(--down);border-color:var(--down)}
.flash-up{animation:fu .9s ease-out} .flash-down{animation:fd .9s ease-out}
@keyframes fu{from{background:#1FD37B44}to{background:transparent}} @keyframes fd{from{background:#FB4B5344}to{background:transparent}}

/* bot status */
.bot{padding:10px;display:flex;flex-direction:column;gap:10px}
.bot .top{display:flex;align-items:center;gap:10px}
.bstate{font:600 15px var(--sans)} 
.bstate.running{color:var(--up)} .bstate.paused{color:var(--warn)} .bstate.stopped{color:var(--dim)} .bstate.error{color:var(--down)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv .k{color:var(--faint)} .kv .v{text-align:right;font-family:var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{padding:7px 8px;border:1px solid var(--line2);border-radius:4px;background:var(--panel2);font-weight:500;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim)} .btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover:not(:disabled){background:#8170ff}
.btn.danger{border-color:var(--down);color:var(--down)} .btn.danger:hover:not(:disabled){background:var(--down-dim);border-color:var(--down)}
.estop{grid-column:1/4;background:repeating-linear-gradient(135deg,#FB4B5322 0 8px,#FB4B5312 8px 16px);border:1px solid var(--down);color:var(--down);font-weight:600;padding:9px}
.estop:hover:not(:disabled){background:var(--down);color:#fff}

/* position card */
.poscard{padding:10px;display:flex;flex-direction:column;gap:8px}
.pnl-big{font:600 26px/1 var(--mono)}
.pcard-head{display:flex;justify-content:space-between;align-items:baseline}
.ladder{position:relative;height:74px;margin:6px 4px 2px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.stat-grid .s{display:flex;justify-content:space-between;gap:8px} .stat-grid .k{color:var(--faint)}

/* roi */
.roi-main{display:flex;align-items:flex-end;gap:12px;padding:10px 10px 4px}
.roi-main .big{font:600 30px/1 var(--mono)}
.roi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:6px}
.roi-grid>div{background:var(--panel);padding:7px 10px}
.roi-grid .k{font-size:11px;color:var(--faint)} .roi-grid .v{font:500 13px var(--mono)}
.spark{display:block;width:100%;height:76px}

/* balance */
.bal{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.bal>div{background:var(--panel);padding:7px 10px}
.bal .k{font-size:11px;color:var(--faint)} .bal .v{font:500 13.5px var(--mono)}
.bal .wide{grid-column:1/3}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--pulse);border-radius:3px;transition:width .4s}
.bar.ok>i{background:var(--up)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--down)}
.bar .th{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--warn)}
.rk{display:grid;gap:9px}
.rk .row{display:grid;grid-template-columns:1fr auto;gap:3px 8px} .rk .row .bar{grid-column:1/3}
.rk .row .k{color:var(--dim)}

/* activity */
.log{list-style:none}
.log li{display:grid;grid-template-columns:62px 8px 92px 1fr auto;gap:8px;align-items:baseline;padding:5px 10px;border-bottom:1px solid #1a1f2e;font-size:12px}
.log li .t{font-family:var(--mono);color:var(--faint)}
.log li .b{width:3px;align-self:stretch;border-radius:2px;background:var(--pulse)}
.log li.success .b{background:var(--up)} .log li.warn .b{background:var(--warn)} .log li.error .b{background:var(--down)}
.log li.error{background:linear-gradient(90deg,var(--down-dim),transparent 60%)}
.log li .ty{color:var(--dim);white-space:nowrap} .log li .ref{font-family:var(--mono);color:var(--faint)}
.log li.flashin{animation:fu 1.2s ease-out}

/* forms / modal */
#modal{position:fixed;inset:0;background:#05080Dcc;display:none;place-items:center;z-index:50}
#modal.on{display:grid}
.dlg{width:min(460px,92vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:0 20px 60px #000a}
.dlg.wide{width:min(760px,94vw)}
.dlg h2{font-size:15px;font-weight:600;padding:14px 16px 4px}
.dlg .body{padding:6px 16px 14px;color:var(--dim);display:grid;gap:10px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.field{display:grid;gap:4px} .field label{color:var(--dim);font-size:12px}
.field input,.field select,.inp{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;font-family:var(--mono);width:100%}
.field input:focus,.inp:focus{border-color:var(--accent);outline:0}
input[type=range]{accent-color:var(--accent);width:100%}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:6px;z-index:60}
.toast{padding:9px 12px;border:1px solid var(--line2);border-left:3px solid var(--pulse);background:var(--panel2);border-radius:4px;max-width:340px;animation:fu .6s}
.toast.error{border-left-color:var(--down)} .toast.success{border-left-color:var(--up)}

/* pages */
.page{display:grid;gap:8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line)}
.toolbar .inp{width:auto;padding:5px 8px}
.pager{display:flex;align-items:center;gap:10px;padding:8px 10px;justify-content:flex-end;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pipecol h4{font-size:12px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.setup{padding:8px 10px;border-bottom:1px solid #1a1f2e;display:grid;gap:4px;cursor:pointer} .setup:hover{background:var(--panel2)}
.flags{display:flex;gap:3px;flex-wrap:wrap}
.flag{font:500 10.5px var(--mono);padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--faint)}
.flag.on{color:var(--up);border-color:#1FD37B55;background:var(--up-dim)}
.tl{display:grid;gap:0;padding-left:8px}
.tl .it{position:relative;padding:0 0 12px 18px;border-left:1px solid var(--line2)}
.tl .it::before{content:"";position:absolute;left:-4px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tl .it.success::before{background:var(--up)} .tl .it.error::before{background:var(--down)}
.tl .it .tm{font:11px var(--mono);color:var(--faint)}
.hint{color:var(--faint);font-size:11.5px}
@media (max-width:1300px){.dash{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="logo" title="Synapse"><svg viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 22 L13 10 L19 18 L26 7" stroke="#6E5BFF"/><circle cx="6" cy="22" r="2.6" fill="#0A0E16" stroke="#35E3E3"/><circle cx="13" cy="10" r="2.6" fill="#0A0E16" stroke="#35E3E3"/><circle cx="19" cy="18" r="2.6" fill="#0A0E16" stroke="#35E3E3"/><circle cx="26" cy="7" r="2.6" fill="#35E3E3" stroke="#35E3E3"/></svg></div>
    <div class="pairsel"><select id="pairSel" aria-label="Trading pair"></select></div>
    <div class="tk big"><span class="l">Last price</span><span class="v num" id="hPrice">-</span></div>
    <div class="tk"><span class="l">24h change</span><span class="v" id="hChg">-</span></div>
    <div class="tk"><span class="l">24h high</span><span class="v" id="hHigh">-</span></div>
    <div class="tk"><span class="l">24h low</span><span class="v" id="hLow">-</span></div>
    <div class="tk"><span class="l">24h volume (USDT)</span><span class="v" id="hVol">-</span></div>
    <div class="sp"></div>
    <div class="chip" id="hBot" title="Bot status"><span class="dot" id="hBotDot"></span><span id="hBotTxt">-</span></div>
    <div class="chip" id="hConn" title="Data connection"><span class="dot" id="hConnDot"></span><span id="hConnTxt">-</span></div>
    <div class="chip mono" id="hClock">--:--:--</div>
  </header>
  <nav id="rail" aria-label="Main"></nav>
  <main id="view"><div id="banner"></div><div id="page"></div></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* =====================================================================
   Synapse terminal. One file, no build step.
   Two data sources share one contract: DemoSource (synthetic, shaped
   like the real Synapse schema) and LiveSource (bot API + SSE).
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dpOf = (v) => { v = Math.abs(v); return v >= 100 ? 2 : v >= 10 ? 3 : v >= 1 ? 4 : 5; };
const fpx = (v, ref) => v == null || isNaN(v) ? '-' : Number(v).toLocaleString('en-US', { minimumFractionDigits: dpOf(ref ?? v), maximumFractionDigits: dpOf(ref ?? v) });
const fm = (v, sign) => v == null || isNaN(v) ? '-' : (sign && v > 0 ? '+' : v < 0 ? '-' : '') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fpc = (v, sign = true) => v == null || isNaN(v) ? '-' : (sign && v > 0 ? '+' : v < 0 ? '-' : '') + Math.abs(v).toFixed(2) + '%';
const fq = (v) => v == null ? '-' : Number(v).toLocaleString('en-US', { maximumFractionDigits: v >= 100 ? 1 : 3 });
const fbig = (v) => v == null ? '-' : v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'K' : v.toFixed(0);
const cls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'dim');
const two = (n) => String(n).padStart(2, '0');
const hms = (t) => { const d = new Date(t); return `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`; };
const dt = (t) => { if (!t) return '-'; const d = new Date(t); return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`; };
const dur = (ms) => { if (ms == null) return '-'; const m = Math.floor(ms / 60000); const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}m` : `${m}m`; };
const coin = (s) => s.replace(/USDT$/, '');
const sideOf = (d) => (d === 'bullish' || d === 'long' ? 'long' : 'short');

const ICON = {
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  positions: '<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/>',
  orders: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  trades: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 8v5l3 2"/>',
  performance: '<path d="M3 20h18"/><path d="m5 16 4-5 4 3 6-8"/>',
  activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  strategies: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="8" cy="18" r="2.5"/><path d="m8 7 8 1M7 8.5l1 7M16.5 10l-6.5 6.5"/>',
  risk: '<path d="M12 3 4 6v6c0 4.5 3.2 7.7 8 9 4.8-1.3 8-4.5 8-9V6l-8-3Z"/><path d="M12 8v5M12 16v.5"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
};
const NAV = [['dashboard', 'Dashboard'], ['positions', 'Positions'], ['orders', 'Orders'], ['trades', 'Trades'], ['performance', 'Performance'], ['activity', 'Activity'], ['strategies', 'Strategies'], ['risk', 'Risk'], ['settings', 'Settings']];

/* ---------- app state ---------- */
const S = {

    } catch (err) {
      SRC = DemoSource; live = false;
      if (want === 'live') toast('Could not reach the bot: ' + err.message + '. Showing demo data.', 'error');
    }
  }
  if (!live) { SRC = DemoSource; S.mode = 'demo'; S.conn = { state: 'demo', last: Date.now() }; S.history = (await DemoSource.trades({ size: 9999, sort: 'closedAt', dir: 'asc' })).all; await DemoSource.init(); }
  if (!location.hash) location.hash = '#/dashboard'; route();
  setInterval(() => { updateHeader(); if (SRC === LiveSource && curPage === 'dashboard') { /* durations tick via state stream */ } }, 1000);
  if (SRC === LiveSource) setInterval(() => { if (curPage === 'dashboard') loadCandles(); }, 20000);
}
boot();
</script></body></html>
